name: Sync grocery Storage images

on:
  push:
    branches: [main]
    paths:
      - 'supabase/seed-assets/grocery-images/**'
      - 'scripts/sync-storage-images.mjs'
      - '.github/workflows/sync-grocery-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload public catalog images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-storage-images.mjs
